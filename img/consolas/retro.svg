<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Sombra base -->
  <ellipse cx="100" cy="195" rx="70" ry="10" fill="#000000" opacity="0.6"/>

  <!-- Consola Clásica Retro de Cartuchos -->
  <rect x="36" y="80" width="128" height="95" rx="14" fill="#222227" stroke="#323238" stroke-width="1.2"/>
  <rect x="42" y="86" width="116" height="83" rx="10" fill="#18181c"/>

  <!-- Bahía de cartuchos en relieve superior -->
  <rect x="58" y="92" width="84" height="26" rx="4" fill="#0f0f12" stroke="#2a2a30" stroke-width="1"/>
  <!-- Tapa / Ranura del cartucho -->
  <rect x="66" y="98" width="68" height="12" rx="2" fill="#1e1e24"/>
  <line x1="72" y1="104" x2="128" y2="104" stroke="#09090b" stroke-width="1.5"/>

  <!-- Panel frontal: Botones Power / Reset y LED -->
  <!-- LED rojo retro encendido -->
  <circle cx="58" cy="144" r="3" fill="#ff453a" filter="drop-shadow(0 0 5px #ff453a)"/>
  <text x="58" y="156" fill="#71717a" font-size="6" font-family="sans-serif" text-anchor="middle">POWER</text>

  <!-- Botón Power -->
  <rect x="74" y="136" width="18" height="12" rx="2" fill="#2e2e36" stroke="#3f3f46" stroke-width="0.8"/>
  <!-- Botón Reset -->
  <rect x="100" y="136" width="18" height="12" rx="2" fill="#2e2e36" stroke="#3f3f46" stroke-width="0.8"/>

  <!-- Puertos de mandos retro (Controller ports) -->
  <rect x="130" y="137" width="18" height="10" rx="3" fill="#0f0f12" stroke="#27272a" stroke-width="0.8"/>
  <circle cx="135" cy="142" r="1.2" fill="#52525b"/>
  <circle cx="139" cy="142" r="1.2" fill="#52525b"/>
  <circle cx="143" cy="142" r="1.2" fill="#52525b"/>

  <!-- Franja decorativa clásica de color -->
  <line x1="42" y1="124" x2="158" y2="124" stroke="#bf5af2" stroke-width="2" opacity="0.6"/>
</svg>
