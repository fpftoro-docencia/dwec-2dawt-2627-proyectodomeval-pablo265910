<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Sombra base -->
  <ellipse cx="100" cy="180" rx="75" ry="10" fill="#000000" opacity="0.6"/>

  <!-- CONSOLA NINTENDO SWITCH -->
  <!-- Joy-Con Izquierdo (Azul Neón) -->
  <path d="M 32 80 C 24 80 20 90 20 102 L 20 148 C 20 160 24 170 32 170 L 48 170 L 48 80 Z" 
        fill="#00c3e3" stroke="#009bb5" stroke-width="1"/>
  <!-- Botón Menos (-) y Joystick izquierdo -->
  <rect x="36" y="88" width="6" height="2" rx="1" fill="#18181b"/>
  <circle cx="34" cy="110" r="8" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
  <circle cx="34" cy="110" r="3.5" fill="#27272a"/>
  <!-- D-Pad botones separados -->
  <circle cx="34" cy="136" r="2.5" fill="#18181b"/>
  <circle cx="34" cy="150" r="2.5" fill="#18181b"/>
  <circle cx="27" cy="143" r="2.5" fill="#18181b"/>
  <circle cx="41" cy="143" r="2.5" fill="#18181b"/>
  <!-- Botón captura de pantalla -->
  <rect x="38" y="158" width="4" height="4" rx="0.8" fill="#18181b"/>

  <!-- Joy-Con Derecho (Rojo Neón) -->
  <path d="M 168 80 C 176 80 180 90 180 102 L 180 148 C 180 160 176 170 168 170 L 152 170 L 152 80 Z" 
        fill="#ff4554" stroke="#d62e3d" stroke-width="1"/>
  <!-- Botón Más (+) -->
  <path d="M 158 87 L 164 87 M 161 84 L 161 90" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Botones ABXY -->
  <circle cx="166" cy="103" r="2.5" fill="#18181b"/>
  <circle cx="166" cy="117" r="2.5" fill="#18181b"/>
  <circle cx="159" cy="110" r="2.5" fill="#18181b"/>
  <circle cx="173" cy="110" r="2.5" fill="#18181b"/>
  <!-- Joystick derecho -->
  <circle cx="166" cy="138" r="8" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
  <circle cx="166" cy="138" r="3.5" fill="#27272a"/>
  <!-- Botón Home -->
  <circle cx="158" cy="160" r="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>

  <!-- Cuerpo central y pantalla de la Switch -->
  <rect x="48" y="80" width="104" height="90" rx="4" fill="#09090b" stroke="#1f1f23" stroke-width="1"/>
  <!-- Marco interior negro -->
  <rect x="53" y="84" width="94" height="82" rx="3" fill="#141416"/>
  <!-- Pantalla OLED encendida con brillo sutil -->
  <rect x="58" y="88" width="84" height="74" rx="2" fill="url(#switch-screen-grad)"/>
  
  <!-- Logotipo Switch sutil en pantalla -->
  <path d="M 94 116 C 91 116 89 119 89 122 L 89 128 C 89 131 91 134 94 134 L 97 134 L 97 116 Z" fill="#ffffff" opacity="0.3"/>
  <circle cx="93" cy="122" r="1.5" fill="#ffffff" opacity="0.4"/>
  <path d="M 103 116 L 103 134 L 106 134 C 109 134 111 131 111 128 L 111 122 C 111 119 109 116 106 116 Z" fill="#ffffff" opacity="0.3"/>
  <circle cx="107" cy="128" r="1.5" fill="#ffffff" opacity="0.4"/>

  <defs>
    <linearGradient id="switch-screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d29"/>
      <stop offset="50%" stop-color="#10141d"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
  </defs>
</svg>
