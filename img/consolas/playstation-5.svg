<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Sombra base -->
  <ellipse cx="100" cy="225" rx="65" ry="10" fill="#000000" opacity="0.6"/>
  <!-- Peana / Base de soporte -->
  <ellipse cx="100" cy="220" rx="42" ry="7" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
  <ellipse cx="100" cy="218" rx="36" ry="5" fill="#09090b"/>

  <!-- Halo de luz azul PlayStation -->
  <path d="M 92 35 Q 98 110 93 210" stroke="#0070d1" stroke-width="3" opacity="0.75" filter="drop-shadow(0 0 6px #0070d1)"/>
  <path d="M 108 35 Q 102 110 107 210" stroke="#0070d1" stroke-width="3" opacity="0.75" filter="drop-shadow(0 0 6px #0070d1)"/>

  <!-- Núcleo central negro (Torre PS5) -->
  <path d="M 93 32 Q 99 110 94 214 L 106 214 Q 101 110 107 32 Z" fill="#0c0d12"/>
  <path d="M 95 40 L 95 210" stroke="#1f222e" stroke-width="1"/>
  
  <!-- Ranura de disco óptico (Lado derecho) -->
  <path d="M 108 140 Q 112 170 109 198 L 107 197 Q 110 170 106 141 Z" fill="#181920" stroke="#272936" stroke-width="0.8"/>
  <line x1="108" y1="152" x2="108" y2="186" stroke="#000000" stroke-width="1.2"/>

  <!-- Aleta Blanca Izquierda (Curva aerodinámica PS5) -->
  <path d="M 72 20 Q 94 18 92 48 Q 97 125 84 212 Q 74 216 70 208 Q 85 125 78 40 Q 72 26 72 20 Z" 
        fill="url(#ps5-white-grad-l)" stroke="#e4e4e7" stroke-width="1"/>
  <!-- Reflejo interior aleta izquierda -->
  <path d="M 78 40 Q 86 120 76 205" stroke="#ffffff" stroke-width="1" opacity="0.4"/>

  <!-- Aleta Blanca Derecha (Curva aerodinámica PS5) -->
  <path d="M 128 20 Q 106 18 108 48 Q 103 125 116 212 Q 126 216 130 208 Q 115 125 122 40 Q 128 26 128 20 Z" 
        fill="url(#ps5-white-grad-r)" stroke="#e4e4e7" stroke-width="1"/>
  <!-- Reflejo interior aleta derecha -->
  <path d="M 122 40 Q 114 120 124 205" stroke="#ffffff" stroke-width="1" opacity="0.4"/>

  <!-- Puertos frontales USB y botón de encendido -->
  <circle cx="100" cy="188" r="1.2" fill="#52525b"/>
  <rect x="99.2" y="174" width="1.6" height="5" rx="0.8" fill="#52525b"/>
  <rect x="99" y="162" width="2" height="6" rx="0.8" fill="#0070d1"/>

  <!-- Degradados -->
  <defs>
    <linearGradient id="ps5-white-grad-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
    <linearGradient id="ps5-white-grad-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>
</svg>
