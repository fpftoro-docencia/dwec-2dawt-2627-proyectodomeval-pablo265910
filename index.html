<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameVault - Iniciar sesión</title>
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="min-vh-100 d-flex flex-column">
  <!-- Región accesible para notificaciones y avisos -->
  <div id="contenedor-avisos" class="container mt-3" role="status" aria-live="polite"></div>

  <header class="navbar navbar-gaming py-3">
    <div class="container">
      <a class="brand-gaming" href="index.html">
        <span class="brand-icon">🎮</span>
        <span>GameVault</span>
      </a>
      <nav aria-label="Navegación de acceso">
        <ul class="navbar-nav ms-auto flex-row gap-2">
          <li class="nav-item">
            <a class="nav-link-gaming" href="registro.html">Crear cuenta</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card vault-card p-3 p-sm-4 p-md-5">
          <div class="text-center mb-4">
            <div class="display-6 mb-2">🕹️</div>
            <h1 class="h3 fw-bold mb-2">Bienvenido a GameVault</h1>
            <p class="text-muted small">Tu bóveda personal para catalogar, trackear y organizar tus videojuegos.</p>
          </div>

          <form id="form-login" novalidate>
            <div class="mb-3">
              <label for="campo-usuario" class="form-label fw-semibold">Nombre de usuario</label>
              <input type="text" id="campo-usuario" name="usuario" class="form-control" placeholder="Ej. pixel_hunter" autocomplete="username" required>
              <div id="error-usuario" class="invalid-feedback" aria-live="polite"></div>
            </div>

            <div class="mb-4">
              <label for="campo-clave" class="form-label fw-semibold">Contraseña</label>
              <input type="password" id="campo-clave" name="clave" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
              <div id="error-clave" class="invalid-feedback" aria-live="polite"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fs-6">
              Entrar a la Bóveda &rarr;
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
            <span class="text-muted small">¿Todavía no tienes cuenta?</span>
            <a href="registro.html" class="ms-1 fw-semibold text-info text-decoration-none small">Regístrate gratis</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-gaming mt-auto py-3 text-center">
    <div class="container small">
      GameVault &copy; 2026 - Gestión de Colecciones de Videojuegos (DWEC)
    </div>
  </footer>
</body>
</html>
