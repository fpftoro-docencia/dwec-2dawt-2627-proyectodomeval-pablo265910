<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - GameVault</title>
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Contenedor global de notificaciones accesible -->
  <div id="notificaciones-globales" class="steam-toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

  <header class="steam-topbar py-2">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="steam-brand" aria-label="GameVault Inicio">
        <svg class="steam-brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a10 10 0 0 0-9.95 9.04l5.37 2.22a2.82 2.82 0 0 1 2.28-.48l2.44-3.54v-.05a3.78 3.78 0 1 1 3.78 3.78h-.08l-3.48 2.48c0 .19-.03.38-.09.56a2.84 2.84 0 0 1-5.46-.34L3.09 14.1A10 10 0 1 0 12 2zm3.92 5.44a2.52 2.52 0 1 0 0 5.04 2.52 2.52 0 0 0 0-5.04zm-6.48 7.5a1.89 1.89 0 1 0 0 3.78 1.89 1.89 0 0 0 0-3.78z"/>
        </svg>
        <span>GAMEVAULT</span>
      </a>
    </div>
  </header>

  <main class="steam-auth-wrapper">
    <section class="steam-panel steam-auth-card" aria-labelledby="titulo-login">
      <div class="mb-4">
        <h1 id="titulo-login" class="h4 text-uppercase mb-1">Iniciar sesión</h1>
        <p class="text-secondary small mb-0">Accede a tu biblioteca y gestor de backlog de GameVault</p>
      </div>

      <form id="form-login" action="listado.html" method="post" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Nombre de usuario</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            autocomplete="username"
            required
            aria-invalid="false"
            aria-describedby="error-username"
          >
          <div id="error-username" class="field-error"></div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            autocomplete="current-password"
            required
            aria-invalid="false"
            aria-describedby="error-password"
          >
          <div id="error-password" class="field-error"></div>
        </div>

        <div class="d-grid mb-4">
          <button type="submit" id="btn-login" class="btn-steam-primary">
            Iniciar sesión
          </button>
        </div>

        <div class="text-center pt-3 border-top border-secondary border-opacity-25">
          <a href="registro.html" class="small fw-semibold">
            ¿No tienes una cuenta de GameVault? Crea una gratis
          </a>
        </div>
      </form>
    </section>
  </main>

  <footer class="steam-footer">
    <div class="container text-center">
      <span>&copy; 2026 GameVault Library Manager. Interfaz inspirada en Steam Desktop Client.</span>
    </div>
  </footer>
</body>
</html>
