<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameVault - Administración de usuarios</title>
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="min-vh-100 d-flex flex-column">
  <!-- Región accesible para notificaciones y avisos -->
  <div id="contenedor-avisos" class="container mt-3" role="status" aria-live="polite"></div>

  <header class="navbar navbar-gaming py-3">
    <div class="container">
      <a class="brand-gaming" href="listado.html">
        <span>🎮</span>
        <span>GameVault</span>
      </a>
      <nav id="navegacion-principal" aria-label="Navegación principal">
        <ul class="navbar-nav flex-row gap-2 me-auto mb-0 ms-lg-3">
          <li class="nav-item">
            <a class="nav-link-gaming" href="listado.html">Catálogo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link-gaming" href="ficha.html">Añadir juego</a>
          </li>
          <li class="nav-item" id="enlace-admin">
            <a class="nav-link-gaming active" aria-current="page" href="usuarios.html">Usuarios</a>
          </li>
        </ul>
      </nav>
      <div id="zona-usuario" class="d-flex align-items-center ms-auto gap-3">
        <span id="info-usuario" class="small text-muted">
          <strong id="nombre-usuario" class="text-light">Admin</strong>
          <span id="rol-usuario" class="badge bg-danger ms-1">administrador</span>
        </span>
        <button id="btn-cerrar-sesion" class="btn btn-outline-light btn-sm" type="button">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="container py-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h1 class="h2 fw-bold m-0">Administración de usuarios</h1>
      <a href="listado.html" class="btn btn-outline-light btn-sm">&larr; Volver al catálogo</a>
    </div>

    <!-- Contenedor base de la página (se implementa en Sprint 2) -->
    <section id="seccion-usuarios" class="card vault-card p-5 text-center text-muted" aria-label="Administración de usuarios">
      <p class="fs-5 mb-0">La gestión de usuarios y roles se implementará en el Sprint 2.</p>
    </section>
  </main>

  <footer class="footer-gaming mt-auto py-3 text-center">
    <div class="container small">
      GameVault &copy; 2026 - Gestión de Colecciones de Videojuegos (DWEC)
    </div>
  </footer>
</body>
</html>
